# Jaeger all-in-one: collector + query + UI в одном поде
# Хранение в памяти — идеально для dev/minikube
provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false

allInOne:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.58"
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Принимает OTLP трейсы напрямую
  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"

storage:
  type: memory

agent:
  enabled: false

collector:
  enabled: false

query:
  enabled: false

ingress:
  enabled: false
